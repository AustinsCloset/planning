<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Closet</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Closet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E9ECEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151C" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#E9ECEF; --paper:#FFFFFF; --sunk:#DCE0E6; --ink:#1C2333; --ink-2:#5A6375;
  --rule:#C9CFD8; --accent:#2F4BC4; --on-accent:#FFFFFF; --danger:#B3261E;
  --serif:ui-serif,"New York",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12151C;--paper:#1C212B;--sunk:#262C38;--ink:#E8EBF0;--ink-2:#9AA3B2;--rule:#2F3644;--accent:#93A5FF;--on-accent:#0E1430;--danger:#FF8A80}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:0 16px}
.screen{display:none;padding-top:10px}
.screen.on{display:block}
h1{font:600 32px/1.12 var(--serif);margin:10px 0 2px;letter-spacing:-.01em}
h2{font:600 19px/1.25 var(--serif);margin:26px 0 8px}
p{margin:6px 0}
.muted{color:var(--ink-2)}
.small{font-size:13px}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:12px;background:var(--paper);border:1px solid var(--rule);font-weight:600}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.block{width:100%}
.btn.danger{color:var(--danger)}
.btn.link{background:none;border:0;padding:0 4px;min-height:44px;color:var(--accent)}
.row{display:flex;gap:10px;margin-top:12px}
.row>.btn{flex:1}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex:none;min-height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* segmented */
.seg{display:flex;background:var(--sunk);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;min-height:36px;border-radius:8px;font-size:15px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.14)}

/* weather */
.wx{display:flex;width:100%;text-align:left;align-items:center;gap:12px;margin:12px 0 4px;padding:12px 14px;border-radius:14px;background:var(--paper)}
.wx .temp{font:600 30px/1 var(--serif);min-width:62px}
.wx .det{flex:1;font-size:14px;color:var(--ink-2);line-height:1.35}
.wx .det b{color:var(--ink);font-weight:600}
.wx .chg{color:var(--accent);font-weight:600;font-size:15px}

/* outfit label: the signature */
.label{position:relative;background:var(--paper);border-radius:8px;padding:12px 12px 10px;margin:16px 0 10px}
.label::after{content:"";position:absolute;inset:5px;border:1.5px dashed var(--rule);border-radius:5px;pointer-events:none}
.weave{display:flex;height:50px;border-radius:3px;overflow:hidden;position:relative}
.weave>span{display:block}
.weave::after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 1px,transparent 1px 3px),repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px)}
.label-text{font:600 15px/1.3 var(--serif);text-align:center;margin-top:9px}
@media (prefers-reduced-motion:no-preference){
  .weave.fresh>span{animation:thread .5s ease-out both}
  @keyframes thread{from{transform:scaleY(0);transform-origin:top}to{transform:scaleY(1)}}
}

.pieces{display:flex;flex-direction:column;gap:8px}
.piece{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:14px;padding:8px 10px 8px 8px}
.piece img{width:74px;height:74px;border-radius:10px;object-fit:cover;flex:none;background:var(--sunk)}
.piece .meta{flex:1;min-width:0}
.piece .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.piece .sub{font-size:13px;color:var(--ink-2)}
.swap{display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-weight:600;font-size:14px;min-height:44px;padding:0 6px;flex:none}
.swap svg{width:17px;height:17px}
.piece .pick{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.piece .pick .meta{display:block}
.piece .pick .name,.piece .pick .sub{display:block}
.asks{margin-top:14px}
.why{margin:16px 0 0;padding:0;list-style:none}
.why li{position:relative;padding:6px 0 6px 18px;font-size:15px;color:var(--ink-2);border-top:1px solid var(--rule)}
.why li:first-child{border-top:0}
.why li::before{content:"";position:absolute;left:2px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.add-slot{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.empty{background:var(--paper);border-radius:16px;padding:22px 18px;margin-top:16px}
.empty h2{margin-top:0}
.note{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--sunk);border-radius:12px;padding:6px 6px 6px 14px;margin-top:14px;font-size:14px}

/* closet grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
@media (min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--paper);display:block;width:100%}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .dot{position:absolute;left:6px;bottom:6px;width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.tile .tag{position:absolute;right:6px;top:6px;font-size:11px;font-weight:600;background:var(--ink);color:var(--bg);padding:2px 7px;border-radius:6px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow-y:auto;border-radius:18px 18px 0 0;padding:8px 16px calc(22px + env(safe-area-inset-bottom));transform:translateY(28px);transition:transform .22s ease-out;overscroll-behavior:contain}
.scrim.on .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--rule);margin:4px auto 8px}
.sheet h2{margin-top:6px}
@media (prefers-reduced-motion:reduce){.scrim,.sheet{transition:none}}

.photo{width:100%;max-height:280px;object-fit:contain;background:var(--sunk);border-radius:14px;display:block}
.field{margin:16px 0}
.lbl{display:block;font-size:14px;font-weight:600;margin-bottom:7px}
.hint{font-size:13px;color:var(--ink-2);margin-top:5px}
input[type=text],input[type=search],select{width:100%;min-height:46px;padding:0 12px;border-radius:11px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:42px;height:42px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--rule)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink)}
.sw-pick{position:relative;width:42px;height:42px;border-radius:50%;border:1.5px dashed var(--ink-2);display:grid;place-items:center;font-size:22px;color:var(--ink-2);overflow:hidden}
.sw-pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:50px;border-top:1px solid var(--rule)}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:31px;background:var(--sunk);transition:background .15s}
.switch span::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2.5px solid var(--accent);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--accent)}

.alt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px;border-radius:14px;background:var(--paper);margin-bottom:8px}
.alt img{width:60px;height:60px;border-radius:9px;object-fit:cover;flex:none}
.alt .meta{flex:1;min-width:0}
.fit{font-size:13px;font-weight:600}
.fit.great{color:#1E7A46}
@media (prefers-color-scheme:dark){.fit.great{color:#7BD8A0}}

.card{background:var(--paper);border-radius:14px;padding:4px 14px 12px}
.card .toggle:first-child{border-top:0}
.results button{display:block;width:100%;text-align:left;padding:12px 4px;border-top:1px solid var(--rule)}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--rule);padding:4px 8px calc(4px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:50px;font-size:11px;font-weight:500;color:var(--ink-2)}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
[hidden]{display:none!important}

/* ask-first prompts */
.ask{background:var(--paper);border-radius:14px;padding:12px 14px;margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ask .q{flex:1 1 180px;min-width:0}
.ask .q b{display:block;font-weight:600}
.ask .q span{font-size:13px;color:var(--ink-2)}
.ask .acts{display:flex;gap:8px}
.ask .btn{min-height:38px;padding:0 14px;font-size:14px}

/* music button */
.music{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);font-size:14px;font-weight:600}
.music[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.music svg{width:16px;height:16px}

/* daily welcome */
.welcome{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;color:#F7E7C6;
  background:radial-gradient(120% 90% at 50% 20%,#3B2A55 0%,#1A1630 55%,#0E0D1C 100%);transition:opacity .6s ease}
.welcome.out{opacity:0;pointer-events:none}
.welcome .line{font:italic 600 clamp(30px,9vw,46px)/1.12 var(--serif);letter-spacing:.005em;max-width:12ch}
.welcome .rule{width:64px;height:2px;background:linear-gradient(90deg,transparent,#E5B96B,transparent)}
.welcome .sub{font-size:14px;opacity:.75;color:#EADBC0}
.welcome button.play{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(229,185,107,.6);background:rgba(229,185,107,.12);color:#F7E7C6;font:600 15px var(--sans)}
.welcome button.play svg{width:16px;height:16px}
@media (prefers-reduced-motion:no-preference){
  .welcome .line{animation:glide 1.1s cubic-bezier(.2,.7,.2,1) both}
  .welcome .rule{animation:grow 1.2s .3s ease-out both}
  @keyframes glide{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
}
.photo-note{font-size:13px;color:var(--ink-2);margin:8px 0 0}
.rot{margin-top:8px}.rot .btn{min-height:40px;font-size:14px}
</style>
</head>
<body>
<main>
  <section id="today" class="screen on" aria-label="Today's outfit"></section>
  <section id="closet" class="screen" aria-label="Closet"></section>
  <section id="settings" class="screen" aria-label="Settings"></section>
</main>

<nav class="tabs" aria-label="Main">
  <button data-tab="today" aria-current="page">
    <svg viewBox="0 0 24 24"><path d="M12 4.5a2 2 0 1 1 2 2c-.9 0-2 .6-2 1.6v.4m0 0L3.6 15.2c-.9.7-.4 2.1.7 2.1h15.4c1.1 0 1.6-1.4.7-2.1L12 8.5Z"/></svg>Outfit</button>
  <button data-tab="closet">
    <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M12 3v18M10 11v2M14 11v2"/></svg>Closet</button>
  <button data-action="add">
    <svg viewBox="0 0 24 24"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.7l1.4-2h4.8l1.4 2h1.7A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5Z"/><path d="M12 9.5v5M9.5 12h5"/></svg>Add</button>
  <button data-tab="settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>Settings</button>
</nav>

<input type="file" id="picker" accept="image/*" multiple hidden>
<input type="file" id="importer" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
'use strict';
/* ---------- constants ---------- */
const CATS={top:'Top',bottom:'Bottom',outer:'Outerwear',shoes:'Shoes',accessory:'Accessory'};
const PLURAL={top:'Tops',bottom:'Bottoms',outer:'Outerwear',shoes:'Shoes',accessory:'Accessories'};
const CAT_ORDER=['outer','top','bottom','shoes','accessory'];
const SEASONS=['spring','summer','fall','winter'];
const STYLES=['casual','work','formal','athletic','going out','lounge'];
const WARMTH={1:'Light',2:'Medium',3:'Warm'};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const PRIMARY_ORDER=['top','bottom','outer','shoes','accessory'];
const catsOf=p=>(p.cats&&p.cats.length?p.cats:[p.category]);
const inCat=(p,c)=>catsOf(p).includes(c);
const isShorts=p=>p.length?p.length==='shorts':(p.kind==='shorts'||/\bshorts?\b/i.test(p.name||''));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];

/* ---------- storage ---------- */
const db=(()=>{
  let p;
  const open=()=>p||(p=new Promise((res,rej)=>{
    const r=indexedDB.open('closet',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('items',{keyPath:'id'});d.createObjectStore('history',{keyPath:'id'});};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  }));
  const tx=async(store,mode,fn)=>{const d=await open();return new Promise((res,rej)=>{
    const t=d.transaction(store,mode),r=fn(t.objectStore(store));let out;
    if(r)r.onsuccess=()=>{out=r.result};
    t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
  });};
  return{all:s=>tx(s,'readonly',st=>st.getAll()),put:(s,v)=>tx(s,'readwrite',st=>st.put(v)),del:(s,k)=>tx(s,'readwrite',st=>st.delete(k))};
})();
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let settings=Object.assign({location:null,avoidDays:3,manual:null,lastBackup:null,autoTag:false},ls.get('closet.settings',{}));
const saveSettings=()=>ls.set('closet.settings',settings);

/* ---------- state ---------- */
let extras={outer:null,acc:null,bottom:null},items=[],wx=null,wxError=null,day=0,style='any',current=null,currentKey='',shown=new Set(),closetFilter='all';
const getItem=id=>items.find(i=>i.id===id);
const avail=()=>items;

/* ---------- color ---------- */
const hexToRgb=h=>{h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
const rgbToHex=c=>'#'+c.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return{h,s,l}}
const _desc=new Map();
function describe(hex){
  if(_desc.has(hex))return _desc.get(hex);
  const{h,s,l}=rgbToHsl(...hexToRgb(hex));let name,neutral=false;
  if(l<0.13){name='black';neutral=true}
  else if(l>0.88){name=(h>=25&&h<=60&&s>0.35)?'cream':'white';neutral=true}
  else if(s<0.12){name=l<0.35?'charcoal':l<0.68?'gray':'light gray';neutral=true}
  else if(h>=200&&h<=250&&l<0.3){name='navy';neutral=true}
  else if(h>=195&&h<=232&&s<0.55&&l<0.65){name='denim';neutral=true}
  else if(h>=20&&h<=55&&s<0.55&&l>=0.6){name=l>0.78?'cream':'tan';neutral=true}
  else if(h>=12&&h<=45&&l<0.42){name='brown';neutral=true}
  else if(h>=45&&h<=80&&l<0.42&&s<0.6){name='olive';neutral=true}
  else if(h<12||h>=345)name=l<0.33?'burgundy':l>0.7?'pink':'red';
  else if(h<42)name=l>0.72?'peach':'orange';
  else if(h<66)name=l<0.45?'mustard':'yellow';
  else if(h<95)name=l<0.45?'olive':'lime';
  else if(h<165)name=l<0.3?'forest green':l>0.7?'mint':'green';
  else if(h<195)name='teal';
  else if(h<250)name=l>0.7?'light blue':'blue';
  else if(h<290)name=l>0.7?'lavender':'purple';
  else name=l<0.4?'plum':'pink';
  const o={hex,name,neutral,h,s,l};_desc.set(hex,o);return o;
}
function pairScore(a,b){

  const shoes=poolFor('shoes',ctx);if(shoes.length){const sh=bestFor(ps,shoes,ctx,0.6);if(sh)ps.push(sh)}
  if(extras.outer===true){const o=bestFor(ps,poolFor('outer',ctx),ctx,0.5);if(o)ps.push(o)}
  if(extras.acc===true){const a=bestFor(ps,poolFor('accessory',ctx),ctx,0.4);if(a)ps.push(a)}

function explain(ps,ctx){
  const out=[],main=ps.filter(p=>['top','bottom','onepiece','outer'].includes(p.category));
  if(main.length>=2){
    let bp=null;
    for(let i=0;i<main.length;i++)for(let j=i+1;j<main.length;j++){const a=describe(main[i].primary),b=describe(main[j].primary),r=pairScore(a,b);if(!bp||r.s>bp.r.s)bp={a,b,r}}
    const{a,b,r}=bp,A=a.name,B=b.name;
    const t={neutrals:`${cap(A)} and ${B} are both neutrals, so they always work together.`,
      tonal:`Head-to-toe ${A} reads clean and intentional.`,
      anchor:`The ${a.neutral?A:B} keeps the ${a.neutral?B:A} grounded.`,
      mono:`${cap(A)} and ${B} sit in the same color family, light against dark.`,
      analogous:`${cap(A)} and ${B} are neighbors on the color wheel.`,
      complement:`${cap(A)} and ${B} are opposites on the color wheel, so each one pops.`,
      triad:`${cap(A)} and ${B} make a bold, high-contrast pairing.`,
      clash:`${cap(A)} with ${B} is a risky pairing. Add more neutrals to your closet for safer picks.`}[r.why];
    out.push(t);
  }else if(main.length===1)out.push(`The ${itemName(main[0]).toLowerCase()} carries the outfit on its own.`);
  const w=ctx.weather,outer=ps.find(p=>p.category==='outer');
  if(w){
    if(outer&&ctx.rainy&&outer.waterproof)out.push(`${w.rain}% chance of rain, so the waterproof ${itemName(outer).toLowerCase()}.`);
    else if(outer)out.push(`High of ${w.high}°, low of ${w.low}°, so a layer on top.`);
    else if(ctx.needOuter)out.push(`High of ${w.high}°${ctx.rainy?' with rain likely':''}, so a jacket is a good idea.`);
    else if(w.high>=78)out.push(`Warm day at ${w.high}°, so it stays light.`);
    else out.push(`High of ${w.high}°, no jacket needed.`);
    if(ctx.rainy&&outer&&!outer.waterproof)out.push(`Rain is likely. Tag a jacket as waterproof so it gets picked on days like this.`);
  }else out.push(`Picked for ${ctx.season}. Set your location in Settings to match the weather.`);
  if(ctx.style!=='any'){
    out.push(`Every piece is tagged ${ctx.style}.`);
  }
  return out;
}

// "Add jacket" / "Add accessory" drop a random good match from that category into the outfit.
function addRandom(slot){
  const ctx=buildCtx(),ps=pieces(),used=new Set(ps.map(p=>p.id));
  const list=poolFor(slot,ctx).filter(i=>!used.has(i.id)).map(i=>({i,s:scoreOutfit([...ps,i],ctx)-recentPenalty(i.id)*0.4+Math.random()*0.8})).sort((a,b)=>b.s-a.s);
  const pick=pickWeighted(list,0.8);if(!pick)return;
  if(slot==='outer')extras.outer=true;if(slot==='accessory')extras.acc=true;
  current={...current,picks:[...current.picks.filter(p=>p.slot!==slot),{id:pick.i.id,slot}].sort((x,y)=>CAT_ORDER.indexOf(x.slot)-CAT_ORDER.indexOf(y.slot))};
  remember(current.picks);
}
// Shuffle swaps in a random good match from the same category, avoiding the last few it showed.
function shuffleSlot(slot){
  const ctx=buildCtx(),ps=pieces(),cur=ps.find(p=>p.category===slot),rest=ps.filter(p=>p!==cur);
  const used=new Set(ps.map(p=>p.id)),hist=shuffleHist[slot]=shuffleHist[slot]||[];
  const pool=poolFor(slot,ctx).filter(i=>!used.has(i.id));
  if(!pool.length){toast(`No other ${PLURAL[slot].toLowerCase()} to shuffle in${ctx.style!=='any'?` for ${ctx.style}`:''}.`);return}
  const fresh=pool.filter(i=>!hist.includes(i.id)),list=(fresh.length?fresh:pool)
    .map(i=>({i,s:scoreOutfit([...rest,i],ctx)-recentPenalty(i.id)*0.4+Math.random()*0.8})).sort((a,b)=>b.s-a.s);
  const pick=pickWeighted(list,0.8).i;
  if(cur)hist.push(cur.id);if(hist.length>Math.max(3,Math.floor(pool.length*0.6)))hist.shift();
  current={...current,picks:current.picks.filter(p=>p.slot!==slot).concat({id:pick.id,slot}).sort((x,y)=>CAT_ORDER.indexOf(x.slot)-CAT_ORDER.indexOf(y.slot))};
  remember(current.picks);renderToday();
}

    </div>

      }
    });

let cityT;
$('#settings').addEventListener('input',e=>{

    cityT=setTimeout(async()=>{try{const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en&format=json`);const j=await r.json();

$('#settings').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.lat){setLocation(+b.dataset.lat,+b.dataset.lon,b.dataset.name);return}
  if(b.id==='geo'){
    if(!navigator.geolocation){toast('Location is not available here. Search for your city instead.');return}
    toast('Finding you');
    navigator.geolocation.getCurrentPosition(p=>setLocation(p.coords.latitude,p.coords.longitude,'your location'),
      ()=>toast('Location was blocked. Search for your city instead.'),{timeout:10000,maximumAge:3600e3});
  }
  if(b.id==='fixSide'){
    const todo=[];b.disabled=true;
    for(const it of items){const img=new Image();img.src=it.photo;try{await img.decode()}catch(_){continue}if(img.naturalWidth>img.naturalHeight*1.15)todo.push(it)}
    if(!todo.length){toast('No sideways-looking photos found.');b.disabled=false;return}
    let fixed=0,n=0;
    for(const it of todo){n++;toast(`Checking photo ${n} of ${todo.length}`);
      try{const src=await canvasFromDataURL(it.photo),up=await uprightCanvas(src);
        if(up.turned){it.photo=up.canvas.toDataURL('image/jpeg',0.88);await db.put('items',it);fixed++}}catch(_){}
    }
    afterChange();toast(fixed?`Turned ${fixed} photo${fixed===1?'':'s'} upright. Rotate any that look wrong.`:'Those photos already look upright.');return;
  }
  if(b.id==='exp')exportBackup();
  if(b.id==='imp')$('#importer').click();
});
function setLocation(lat,lon,name){
  settings.location={lat:+lat.toFixed(3),lon:+lon.toFixed(3),name};settings.manual=null;saveSettings();
  renderSettings();toast(`Weather set to ${name}`);current=null;refreshWeather(true);
}
async function exportBackup(){
  const history=await db.all('history');
  const data={app:'closet',version:1,exportedAt:new Date().toISOString(),items,history,settings:{avoidDays:settings.avoidDays,location:settings.location}};
  const name=`closet-backup-${new Date().toISOString().slice(0,10)}.json`;
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const file=new File([blob],name,{type:'application/json'});
  let done=false;
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'Closet backup'});done=true}catch(err){if(err.name==='AbortError')return}
  }
  if(!done){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000)}
  settings.lastBackup=Date.now();saveSettings();renderSettings();renderToday();toast('Backup saved');
}
$('#importer').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    if(data.app!=='closet'||!Array.isArray(data.items))throw new Error();
    for(const i of data.items)if(i&&i.id&&i.photo&&CATS[i.category]){delete i.inLaundry;await db.put('items',i)}
    for(const h of data.history||[])if(h&&h.id)await db.put('history',h);
    if(data.settings?.location&&!settings.location){settings.location=data.settings.location;saveSettings();refreshWeather(true)}
    items=await db.all('items');current=null;afterChange();toast(`Restored ${data.items.length} pieces`);
  }catch{toast('That file is not a Closet backup.')}
});

/* ---------- original R&B groove (generated live, no recordings) ---------- */
const NOTE_ICON='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 17.5V6.2l10-2.2v11.3a3 3 0 1 1-2-2.8V7.3l-6 1.3v8.9a3 3 0 1 1-2-2.8z"/></svg>';
const Groove=(()=>{
  // An original hip-hop / R&B loop built live with Web Audio. 90 BPM, swung 16ths, 8-bar arrangement.
  let ac=null,master=null,keysBus=null,verb=null,drumBus=null,timer=null,on=false,step=0,next=0,noise=null,crackle=null,sat=null;
  const bpm=90,s16=60/bpm/4,SWING=0.22;
  // Ab maj9, G min9, F min9, Bb 13 (sus) voicings and 808 roots
  const CH=[[60,63,67,70],[58,62,65,69],[56,60,63,67],[56,60,62,67]],SUB=[32,31,29,34];
  const LICK=[75,77,79,82,79,77];
  const hz=n=>440*Math.pow(2,(n-69)/12);

  function curve(k){const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=Math.tanh(k*x)/Math.tanh(k)}return c}
  // Electric piano: FM bell attack that mellows out, with a slow tremolo pan.
  function ep(t,n,dur,vel){
    const f=hz(n),car=ac.createOscillator(),mod=ac.createOscillator(),mg=ac.createGain(),g=ac.createGain(),pan=ac.createStereoPanner?ac.createStereoPanner():null;
    car.frequency.value=f;mod.frequency.value=f;mg.gain.setValueAtTime(f*2.2,t);mg.gain.exponentialRampToValueAtTime(f*0.25,t+0.35);
    mod.connect(mg).connect(car.frequency);car.connect(g);
    if(pan){pan.pan.value=((n%7)-3)/8;g.connect(pan).connect(keysBus)}else g.connect(keysBus);
    env(g,t,0.3*vel,0.006,dur);car.start(t);mod.start(t);car.stop(t+dur+0.1);mod.stop(t+dur+0.1);
  }
  const chord=(t,notes,dur,vel)=>notes.forEach((n,i)=>ep(t+i*0.012,n,dur,vel));
  function kick(t,v=1){
    const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(155,t);o.frequency.exponentialRampToValueAtTime(48,t+0.09);o.frequency.exponentialRampToValueAtTime(40,t+0.3);
    o.connect(g).connect(drumBus);env(g,t,0.7*v,0.002,0.3);o.start(t);o.stop(t+0.4);
    hit(t,'highpass',3500,0.3*v,0.012);
  }
  function hit(t,type,freq,peak,dur,q,dest){const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noise;s.playbackRate.value=0.9+Math.random()*0.2;f.type=type;f.frequency.value=freq;if(q)f.Q.value=q;s.connect(f).connect(g).connect(dest||drumBus);env(g,t,peak,0.001,dur);s.start(t,Math.random()*0.5);s.stop(t+dur+0.05);return g}
  function clap(t){
    for(let k=0;k<3;k++)hit(t+k*0.011,'bandpass',1500,1.4,0.03,1.4);
    const tail=hit(t+0.033,'bandpass',1700,1.2,0.17,0.9);tail.connect(verb);
    const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(160,t+0.06);o.connect(g).connect(drumBus);env(g,t,0.12,0.001,0.07);o.start(t);o.stop(t+0.1);
  }
  const hat=(t,v,open)=>hit(t,'highpass',7000,v*5,open?0.16:0.035,0.7);
  // 808 with saturation and a pitch glide into the next note.
  let sub=null;
  function bass(t,n,dur,glideTo){
    const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(hz(n),t);
    if(glideTo)o.frequency.exponentialRampToValueAtTime(hz(glideTo),t+dur*0.9);
    o.connect(g).connect(sat);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.24,t+0.01);g.gain.setTargetAtTime(0.0001,t+dur*0.7,dur*0.25);

  }
  function schedule(st,t){
    const bar=Math.floor(st/16)%8,b4=bar%4,s=st%16,tt=t+((s%2)?s16*SWING:0);
    const breakBar=bar===7&&s>=12;
    // keys: held chord, syncopated stabs, a small lick at the end of each phrase
    if(s===0)chord(tt,CH[b4],s16*9,1);
    if(s===6||s===11)chord(tt,CH[b4].slice(1),s16*2.2,0.6);
    if((bar===3||bar===7)&&s>=10&&s<16){const n=LICK[s-10];if(n)ep(tt,n,s16*2,0.7)}
    // drums
    if(!breakBar){
      const kicks=b4===1||b4===3?[0,6,9,14]:[0,7,10];

    }

    if(s===0)bass(tt,SUB[b4],s16*6);
    if(s===7)bass(tt,SUB[b4]+12,s16*2.5,SUB[b4]+7);

  }
  function tick(){while(next<ac.currentTime+0.15){schedule(step,next);next+=s16;step++}}
  function build(){
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=3;
    master=ac.createGain();master.gain.value=0;master.connect(comp).connect(ac.destination);
    verb=ac.createConvolver();verb.buffer=impulse(1.9);const vg=ac.createGain();vg.gain.value=0.32;verb.connect(vg).connect(master);
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=4200;
    keysBus=ac.createGain();keysBus.gain.value=0.95;keysBus.connect(lp);lp.connect(master);
    const ksend=ac.createGain();ksend.gain.value=0.5;lp.connect(ksend).connect(verb);
    drumBus=ac.createGain();drumBus.gain.value=0.9;drumBus.connect(master);
    sat=ac.createWaveShaper();sat.curve=curve(2.2);const sg=ac.createGain(),sf=ac.createBiquadFilter();sf.type='lowpass';sf.frequency.value=700;sg.gain.value=0.32;sat.connect(sf).connect(sg).connect(master);
    noise=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const ch=noise.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;
    // soft vinyl crackle
    const cb=ac.createBuffer(1,ac.sampleRate*4,ac.sampleRate),cd=cb.getChannelData(0);for(let i=0;i<cd.length;i++)cd[i]=(Math.random()<0.0009?(Math.random()*2-1):0)+(Math.random()*2-1)*0.004;
    crackle=ac.createBufferSource();crackle.buffer=cb;crackle.loop=true;const cf=ac.createBiquadFilter(),cg=ac.createGain();cf.type='bandpass';cf.frequency.value=2500;cg.gain.value=0.35;crackle.connect(cf).connect(cg).connect(master);crackle.start();
  }
  function start(){
    if(on)return;
    try{
      if(!ac)build();
      ac.resume();on=true;step=0;next=ac.currentTime+0.08;
      master.gain.cancelScheduledValues(ac.currentTime);master.gain.setValueAtTime(master.gain.value,ac.currentTime);master.gain.linearRampToValueAtTime(0.6,ac.currentTime+1.5);
      clearInterval(timer);timer=setInterval(tick,25);tick();
    }catch(e){on=false;toast('Music is not available on this device.')}
    refreshMusicBtn();
  }
  function stop(){
    if(!on)return;on=false;
    const t=ac.currentTime;master.gain.cancelScheduledValues(t);master.gain.setValueAtTime(master.gain.value,t);master.gain.linearRampToValueAtTime(0,t+0.6);
    setTimeout(()=>{if(!on){clearInterval(timer);ac.suspend()}},700);refreshMusicBtn();
  }
  document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend();else if(on)ac.resume()});
  return{start,stop,toggle:()=>on?stop():start(),playing:()=>on};
})();
function refreshMusicBtn(){const b=$('#musicBtn');if(!b)return;const p=Groove.playing();b.setAttribute('aria-pressed',p);b.innerHTML=NOTE_ICON+(p?'Playing':'R&amp;B')}

/* ---------- once-a-day welcome ---------- */
const WELCOME=["You're lookin' good, sir.","Sharp as ever, sir.","Well, look who's dressed to impress.","Smooth. Real smooth.","Lookin' like a million bucks.","The fit is fitting, sir.","Cool, calm, and well dressed.","Somebody call the tailor, he's back.","Main character energy, sir.","Easy on the eyes, as usual.","Fresh to death, sir.","Suit up. Or don't. You'll look great either way.","Style for days, sir.","Clean. Crisp. Certified.","Mr. Anderson, the runway is ready."];

function showWelcome(){
  if($('.welcome'))return;
  const first=!ls.get('closet.welcomedEver',false);ls.set('closet.welcomedEver',true);
  let i=first?0:Math.floor(Math.random()*WELCOME.length);if(i===lastWelcome)i=(i+1)%WELCOME.length;lastWelcome=i;
  const w=document.createElement('div');w.className='welcome';w.setAttribute('role','dialog');w.setAttribute('aria-label','Welcome');
  w.innerHTML=`<div class="line">${esc(WELCOME[i])}</div><div class="rule"></div><div class="sub">${esc(new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}))}</div>
    <button class="play" type="button">${NOTE_ICON}${Groove.playing()?'Keep the music going':'Play some R&amp;B'}</button>`;
  document.body.appendChild(w);
  let gone=false;const close=()=>{if(gone)return;gone=true;w.classList.add('out');setTimeout(()=>w.remove(),650)};
  w.addEventListener('click',e=>{if(e.target.closest('.play'))Groove.start();close()});
  setTimeout(close,4000);
}
// Shows on every launch, and again when you come back to the app after a couple of minutes away.
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(hiddenAt&&Date.now()-hiddenAt>2*60e3)showWelcome();
});

/* ---------- start ---------- */
(async()=>{
  try{items=await db.all('items')}catch{toast('Storage is blocked. Turn off Private Browsing and reopen.')}
  try{navigator.storage?.persist?.()}catch{}
  // Undo the old background cleanup (restore original photos) and drop laundry flags.
  for(const it of items){let ch=false;
    if(it.original){it.photo=it.original;delete it.original;ch=true}
    for(const k of ['cleaned','cleanFailed','inLaundry'])if(k in it){delete it[k];ch=true}
    if(!it.cats||!it.cats.length){it.cats=[it.category];ch=true}
    if(ch)try{await db.put('items',it)}catch(_){}
  }
  renderToday();renderCloset();renderSettings();
  showWelcome();
  refreshWeather(false);
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
